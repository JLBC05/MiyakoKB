# ============================================================================
# MiyakoKB 自动构建与发布工作流
# ============================================================================
# 触发方式:
#   1. 在要发布的提交上推送版本标签:
#      git tag v3.3.0
#      git push origin v3.3.0
#   2. 手动触发: GitHub Actions 页面 -> 选择要发布的分支 -> Run workflow
#
# 流程:
#   1. 先创建 Draft Release（更新日志由 RELEASE_NOTES.md 对应版本自动填充）
#   2. 构建单一发行包（依赖见 requirements.txt）
#   3. 人工核对 Draft 后手动发布
# ============================================================================

name: Build and Release

# 触发器键必须加引号：YAML 1.1 会把裸 on 解析成布尔 true，GitHub 就找不到
# 任何触发器，workflow 不会出现在 Actions 页面上，也就没有 Run workflow 按钮。
'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (不带v前缀，如 3.3.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  PIP_NO_CACHE_DIR: '1'

jobs:
  # ============================================================================
  # 准备 Job - 先创建 Draft Release
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    
    steps:
      - uses: actions/checkout@v6

      - name: Verify release guard
        run: node --test .github/scripts/prepare_release.test.cjs

      - name: Get version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG_NAME="v${VERSION}"
          else
            TAG_NAME="$REF_NAME"
            VERSION="${TAG_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          MANIFEST_VERSION=$(jq -er .version version.json)
          if [[ "$VERSION" != "$MANIFEST_VERSION" ]]; then
            echo "Release version differs from version.json: $VERSION != $MANIFEST_VERSION" >&2
            exit 1
          fi
          STORAGE_VERSION=$(jq -er .storageVersion version.json)
          if [[ ! "$STORAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid storage version: $STORAGE_VERSION" >&2
            exit 1
          fi
          test -f "src/storage_migrator/schemas/$STORAGE_VERSION.sql"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION, Tag: $TAG_NAME"

      - name: Verify release target
        id: release_target
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ steps.version.outputs.TAG_NAME }}
        with:
          script: |
            await require('./.github/scripts/prepare_release.cjs')({github, context, core});

      # 更新日志不再是手填占位符：直接从 RELEASE_NOTES.md 抽当前版本那一节。
      # 抽不到就让 prepare 失败——宁可这次不发，也不发出没有更新日志的 release。
      - name: Render release body from RELEASE_NOTES.md
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if ! node .github/scripts/release_notes.cjs "$RELEASE_VERSION" --with-downloads > release-body.md; then
            echo "RELEASE_NOTES.md 缺少 v${RELEASE_VERSION} 一节，先补更新日志再发版" >&2
            exit 1
          fi
          echo "更新日志 $(wc -c < release-body.md) 字节"
          {
            echo "body<<RELEASE_BODY_EOF"
            cat release-body.md
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        if: steps.release_target.outputs.create_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: v${{ steps.version.outputs.VERSION }}
          body: ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 后端契约测试 Job
  # ============================================================================
  # 跑在 ubuntu-latest 而不是 windows-latest：这套测试是纯 Python + SQLite，
  # 与打包平台无关，但 windows runner 的磁盘 I/O 会让它从 11 分钟膨胀到
  # 30 分钟以上仍未完成。发布门槛不变——build 仍然 needs 它，失败就不打包。
  backend-tests:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # 不能加 cache: pip —— 顶层 env 里有 PIP_NO_CACHE_DIR=1，
          # setup-python 定位缓存时会跑 `pip cache dir` 并直接失败。
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8.4,<9"

      - name: Verify backend contracts
        run: python -m pytest tests_backend -q -p no:cacheprovider --durations=20

  # ============================================================================
  # 构建 Job - 单一发行包，直接上传到 Release
  # ============================================================================
  build:
    needs: [prepare, backend-tests]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # --------------------------------------------------
      # 1. 检出代码
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare build disk
        run: |
          # This hosted runner does not need the preinstalled Android SDK.
          $androidSdk = 'C:\Android\android-sdk'
          if (Test-Path -LiteralPath $androidSdk) {
            $resolvedSdk = (Resolve-Path -LiteralPath $androidSdk).Path
            if ($resolvedSdk -ne $androidSdk) { throw 'Unexpected Android SDK path' }
            Remove-Item -LiteralPath $resolvedSdk -Recurse -Force
          }
          $drive = Get-PSDrive -Name ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).Substring(0, 1))
          Write-Host ("Available disk: {0:N1} GiB" -f ($drive.Free / 1GB))
          if ($drive.Free -lt 25GB) { throw 'Packaging needs at least 25 GiB free disk space.' }

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --------------------------------------------------
      # 6. 安装依赖
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # --------------------------------------------------
      # 7. 构建并校验 v2 Web 前端
      # --------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            vue-frontend/package-lock.json

      - name: Build v2 frontend
        working-directory: vue-frontend
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci
          npm run check:api
          npm run build:check

      - name: Verify generated frontend is current
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $changes = @(git status --porcelain -- src/backend_v2/static/vue)
          if ($changes.Count -ne 0) {
            $changes | Write-Host
            throw "Frontend build changed generated static assets"
          }

      # 后端契约测试不再在这里跑：windows-latest 上同一套 825 个用例本机 11 分钟、
      # runner 上 30 分钟仍未完成（三次复现，停在 [87%]）。已移到下面的
      # backend-tests job（ubuntu-latest），build 通过 needs 等它。

      - name: Verify frontend unit tests
        working-directory: vue-frontend
        run: npm test

      - name: Verify frontend lint
        working-directory: vue-frontend
        run: npm run lint

      - name: Verify frontend styles
        working-directory: vue-frontend
        run: npm run lint:css

      - name: Verify frontend architecture
        working-directory: vue-frontend
        run: npm run lint:ui:audit

      # --------------------------------------------------
      # 8. 使用 PyInstaller 打包
      # --------------------------------------------------
      - name: Build with PyInstaller
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Write-Host "Building with PyInstaller..."
          pyinstaller app.spec --noconfirm
          
          Write-Host "Build completed. Output directory:"
          Get-ChildItem -Path dist/ | Select-Object Name

      - name: Probe packaged runtime
        run: python .github/scripts/probe_package.py dist/MiyakoKB/MiyakoKB.exe

      # --------------------------------------------------
      # 10. 7z 分卷压缩（最高压缩率）
      # --------------------------------------------------
      - name: Package with 7z (ultra compression)
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ needs.prepare.outputs.version }}"
          $outputName = "MiyakoKB-$version"
          
          Write-Host "Compressing with 7z format... Output: $outputName.7z (single volume)"
          
          Push-Location dist
          
          # -t7z: 7z native format
          # -mx=9: Maximum compression level
          # -mfb=258: Maximum FastBytes
          # 不分卷：产物始终是单个 MiyakoKB-<版本>.7z，用户下载一个文件即可，
          # 不再需要「把所有分卷放在同一目录再解压 .7z.001」。
          7z a -t7z -mx=9 -mfb=258 "../$outputName.7z" "MiyakoKB/*"
          
          Pop-Location
          
          Write-Host "Compression completed. Generated files:"
          Get-ChildItem "$outputName.7z*" | Format-Table Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}

      # --------------------------------------------------
      # 11. 验证压缩文件
      # --------------------------------------------------
      - name: Verify compressed archives
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ needs.prepare.outputs.version }}"
          $baseName = "MiyakoKB-$version"
          
          Write-Host "Verifying compressed archives..."
          
          # 单包发行：这里应当恰好只有一个文件，多出来就是配置回归。
          $files = Get-ChildItem "$baseName.7z*" | Sort-Object Name
          
          Write-Host "Generated $($files.Count) archive file(s):"
          $files | Format-Table Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB, 2)}}
          
          if ($files.Count -ne 1) {
            throw "Expected exactly 1 archive file for $baseName.7z, found $($files.Count). Split volumes must not be produced anymore."
          }
          
          $archive = $files | Select-Object -First 1
          Write-Host "Testing archive integrity: $($archive.Name)"
          7z t $archive.FullName
          
          Write-Host "Archive verification passed:"

      # --------------------------------------------------
      # 12. 直接上传到 Release（不通过 artifacts）
      # --------------------------------------------------
      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/upload_release_assets.py "${{ needs.prepare.outputs.tag_name }}" . "MiyakoKB-${{ needs.prepare.outputs.version }}.7z*"

  # ============================================================================
  # 完成 Job - 输出结果
  # ============================================================================
  complete:
    needs: [prepare, backend-tests, build]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "=========================================="
          echo "Build and Release Summary"
          echo "=========================================="
          echo ""
          echo "Version: ${{ needs.prepare.outputs.version }}"
          echo "Tag: ${{ needs.prepare.outputs.tag_name }}"
          echo "Backend tests result: ${{ needs.backend-tests.result }}"
          echo "Build result: ${{ needs.build.result }}"
          echo ""
          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "Next steps:"
            echo "  1. Go to GitHub Releases page"
            echo "  2. Edit the draft release v${{ needs.prepare.outputs.version }}"
            echo "  3. Write your changelog"
            echo "  4. Click 'Publish release'"
          else
            echo "The build failed or was cancelled. Keep the release as a draft and inspect the failed job."
          fi
          echo ""
          echo "Link: https://github.com/${{ github.repository }}/releases"
